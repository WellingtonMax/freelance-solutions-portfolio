name: Document Flow - offline demo checks
on:
  push:
    branches: [main]
    paths:
      - 'demos/document-flow/**'
      - '.github/workflows/document-flow-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'demos/document-flow/**'
      - '.github/workflows/document-flow-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    defaults:
      run:
        working-directory: demos/document-flow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate field mapping and sample request
        run: node --test test_merge.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate synthetic DOCX files locally
        run: |
          python -m pip install python-docx
          python make_word_samples.py --out generated
          test "$(find generated -type f -name '*.docx' | wc -l)" -eq 4
