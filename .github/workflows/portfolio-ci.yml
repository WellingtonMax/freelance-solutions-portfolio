name: Freelance Portfolio - Python security regression checks
on:
  push:
    branches: [main]
    paths:
      - '01-excel-rescue/**'
      - '02-sales-intelligence/**'
      - '03-api-bridge/**'
      - '.github/workflows/portfolio-ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
      - name: Verify Node.js runtime
        run: node --version
      - name: Excel Rescue
        working-directory: 01-excel-rescue
        run: python -m unittest discover -v
      - name: Browser CSV preview (Node.js built-in test runner)
        working-directory: 01-excel-rescue
        run: node --test test_try.cjs
      - name: Sales Intelligence
        working-directory: 02-sales-intelligence
        run: python -m unittest discover -v
      - name: API Bridge
        working-directory: 03-api-bridge
        run: python -m unittest discover -v
