name: Landing Page Studio - Chromium acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - '05-landing-page-studio/**'
      - '.github/workflows/landing-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Run offline browser acceptance
        working-directory: 05-landing-page-studio
        run: python check_browser.py
