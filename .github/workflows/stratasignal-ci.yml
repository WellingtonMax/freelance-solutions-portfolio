name: StrataSignal - analytics and security checks

on:
  push:
    branches: [main]
    paths:
      - 'products/stratasignal/**'
      - '.github/workflows/stratasignal-ci.yml'
  pull_request:
    paths:
      - 'products/stratasignal/**'
      - '.github/workflows/stratasignal-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-without-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Standard library and security regression tests
        working-directory: products/stratasignal
        run: python -S -m unittest discover -s tests -v

  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional ML dependencies
        working-directory: products/stratasignal
        run: python -m pip install -r requirements-ml.txt
      - name: Analytics, temporal ML and adversarial regression tests
        working-directory: products/stratasignal
        run: python -m unittest discover -s tests -v
      - name: CLI end-to-end demonstration
        working-directory: products/stratasignal
        run: python -m stratasignal demo --out /tmp/stratasignal-ci-demo

  report-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: products/stratasignal/package-lock.json
      - name: Install test-only DOM dependency
        working-directory: products/stratasignal
        run: npm ci --ignore-scripts
      - name: Report interactions and injection regression tests
        working-directory: products/stratasignal
        run: npm test
